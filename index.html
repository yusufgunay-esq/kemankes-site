<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kemankeş · Okçuluk skor defteri</title>
<style>
  :root { color-scheme: light dark; --z:#1B4A3B; --a:#C6A468; --bg:#F7F5F0; --tx:#1F2422; }
  @media (prefers-color-scheme: dark){ :root { --bg:#121614; --tx:#EDEAE3; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:720px;margin:0 auto;padding:64px 24px}
  h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
  .ust{color:var(--z);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
  @media (prefers-color-scheme: dark){ .ust{color:#5BB89A} }
  p{max-width:60ch}
  a{color:var(--z)} @media (prefers-color-scheme: dark){ a{color:#5BB89A} }
  .kart{margin-top:32px;padding:24px;border:1px solid color-mix(in srgb,var(--tx) 14%,transparent);border-radius:16px}
  ul{padding-left:20px}
</style>
</head>
<body>
<main>
  <div class="ust">Kemankeş</div>
  <h1>Okçuluk skor defteri ve antrenman günlüğü</h1>
  <p>Hedefe ok yerleştirerek puanla, roundları takip et, nişangah tık hesabını ve grup dağılımını gör. Hesap gerekmez; veriler telefonunda kalır.</p>
  <div class="kart">
    <h2 style="margin:0 0 8px;font-size:18px">Belgeler</h2>
    <ul style="margin:0">
      <li><a href="privacy.html">Gizlilik Politikası / Privacy Policy</a></li>
    </ul>
  </div>
  <p style="margin-top:32px;font-size:14px;opacity:.7">© 2026 Yusuf Günay · Gunay Studios</p>
</main>
</body>
</html>
